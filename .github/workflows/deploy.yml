name: Publicar Cartas Proyectivas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descomprimir barajas (si se ha subido el ZIP)
        run: |
          if [ -f cartas-proyectivas-imagenes.zip ]; then unzip -oq cartas-proyectivas-imagenes.zip -d .; fi
          if [ -f cartas-proyectivas-actualizacion-inner-tandoo.zip ]; then
            unzip -oq cartas-proyectivas-actualizacion-inner-tandoo.zip -d .
            echo 'Inner Active y Tandoo actualizadas'
          fi
          if [ -f cartas-proyectivas-actualizacion-resilio.zip ]; then
            unzip -oq cartas-proyectivas-actualizacion-resilio.zip -d .
            echo 'Resilio actualizada y menú reordenado'
          fi
          if [ -f cartas-proyectivas-actualizacion-dixit.zip ]; then
            unzip -oq cartas-proyectivas-actualizacion-dixit.zip -d .
            echo 'Dixit: 144 imágenes extraídas'
          fi
      - name: Aplicar orden definitivo a las barajas
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const hasDixit = fs.existsSync('public/decks/dixit/144.webp');
          const ids = ['cope','tandoo','resilio','shame','inner-active',...(hasDixit?['dixit']:[]),'parcuve','recursos','autocuidado','estados-emocionales','sistemas-de-proteccion'];
          for (const path of ['src/decks.json','public/decks.json']) {
            if (!fs.existsSync(path)) continue;
            const items = JSON.parse(fs.readFileSync(path,'utf8'));
            const map = new Map(items.map(x => [x.id,x]));
            for (const [id,name,count] of [['tandoo','Tandoo',97],['resilio','Resilio',120],['inner-active','Inner Active',74]]) {
              if (!map.has(id)) map.set(id,{id,name,count});
            }
            if (hasDixit && !map.has('dixit')) map.set('dixit',{id:'dixit',name:'Dixit',count:144});
            const result = ids.map(id => map.get(id));
            if (result.some(x => !x)) throw new Error('Falta una baraja en '+path);
            fs.writeFileSync(path, JSON.stringify(result,null,2)+'\n');
          }
          NODE
      - name: Verificar cartas extraídas
        run: |
          test -s public/decks/cope/001.webp
          test -s public/decks/shame/001.webp
          test -s public/decks/parcuve/001.webp
          test -s public/decks/recursos/001.webp
          test -s public/decks/autocuidado/001.webp
          test -s public/decks/estados-emocionales/001.webp
          test -s public/decks/sistemas-de-proteccion/001.webp
          if [ -f cartas-proyectivas-actualizacion-inner-tandoo.zip ]; then
            test -s public/decks/inner-active/074.webp
            test -s public/decks/tandoo/097.webp
          fi
          if [ -f cartas-proyectivas-actualizacion-resilio.zip ]; then
            test -s public/decks/resilio/001.webp
            test -s public/decks/resilio/120.webp
          fi
          if [ -f cartas-proyectivas-actualizacion-dixit.zip ]; then
            for i in $(seq -w 1 144); do test -s public/decks/dixit/$(printf '%03d' "$((10#$i))").webp; done
            node -e "const d=require('./src/decks.json');if(d.length!==11||d[5].id!=='dixit'||d[5].count!==144)process.exit(1)"
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://xddrmhperdrqxjicscsv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_erU4mKonRBgk_N4H7N_SjQ_WMsFmkxw
      - name: Verificar cartas publicadas
        run: |
          test -s dist/decks/cope/001.webp
          test -s dist/decks/shame/001.webp
          if [ -f cartas-proyectivas-actualizacion-inner-tandoo.zip ]; then
            test -s dist/decks/inner-active/074.webp
            test -s dist/decks/tandoo/097.webp
          fi
          if [ -f cartas-proyectivas-actualizacion-resilio.zip ]; then
            test -s dist/decks/resilio/120.webp
          fi
          if [ -f cartas-proyectivas-actualizacion-dixit.zip ]; then
            test -s dist/decks/dixit/001.webp
            test -s dist/decks/dixit/144.webp
          fi
          test -s dist/brand-angel-rull.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
